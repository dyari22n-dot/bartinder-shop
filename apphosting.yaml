# Firebase App Hosting — Next.js لە کلاود (پڕۆژە: bartender-3a68e)
# پێشان: Blaze plan — https://console.firebase.google.com/project/bartender-3a68e/usage/details
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  - variable: FIRESTORE_DATABASE_ID
    value: default
    availability:
      - BUILD
      - RUNTIME
  - variable: FIRESTORE_STORE_DOC
    value: bartender-kurd
    availability:
      - BUILD
      - RUNTIME
  # ڕازاندنەوەی نهێنی لە CLI: firebase apphosting:secrets:set ADMIN_PASSWORD
  # FIREBASE_PRIVATE_KEY یان FIREBASE_SERVICE_ACCOUNT_JSON — هەمان فەرمان